# ============================================================================
# Youcef Project - Docker Compose Configuration
# Orchestrates: PostgreSQL, Backend (FastAPI), Frontend (Vite)
# ============================================================================

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: youcef_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: youcef_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Pr0d@ctS3cur3P@ssw0rd!2024XyZ#9mK$L5vN}
      POSTGRES_HOST_AUTH_METHOD: md5
    # ⚠️ SECURITY: Database NOT exposed to external network
    # Only accessible from backend container via Docker network
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Security: Use custom pg_hba.conf to restrict network access
      - ./db-init/pg_hba.conf:/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d youcef_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - youcef_network

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: youcef_backend
    restart: unless-stopped
    environment:
      # Auto-update settings
      AUTO_GIT_UPDATE: ${AUTO_GIT_UPDATE:-false}
      GIT_BRANCH: ${GIT_BRANCH:-fastapi_v1}

      # Database connection - Use backend service name for Docker networking
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-Pr0d@ctS3cur3P@ssw0rd!2024XyZ#9mK$L5vN}@postgres:5432/youcef_db

      # Application settings
      SECRET_KEY: ${SECRET_KEY:-Pr0d-S3cr3tK3y!@#$%X9mN8pQ7rS6tU5vW4xY3zAb2cD1eF0gH}
      DEBUG: ${DEBUG:-false}

      # CORS settings
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}

    ports:
      - "8001:8001"
    volumes:
      # Mount code for hot-reload (comment out for production)
      - ./fastapi_backend:/app

      # Mount uploads directory (persistent) - create if not exists
      - uploads_data:/app/uploads

      # Logs will be handled internally by the application
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - youcef_network

  # React/Vite Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: youcef_frontend
    restart: unless-stopped
    environment:
      # Auto-update settings
      AUTO_GIT_UPDATE: ${AUTO_GIT_UPDATE:-false}

      # API URL
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8001}

    ports:
      - "3000:3000"
    volumes:
      # Mount code for hot-reload (comment out for production)
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules # Prevent overwriting node_modules
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - youcef_network

# Persistent volumes
volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  frontend_node_modules:
    driver: local

# Network
networks:
  youcef_network:
    driver: bridge
