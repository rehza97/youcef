# PostgreSQL Client Authentication Configuration
# ============================================================================
# This file controls local/network access to PostgreSQL
# SECURITY: Only allow connections from trusted sources

# Database administrative login by Unix domain socket
local   all             postgres                                peer

# TYPE  DATABASE        USER            ADDRESS                 METHOD
# ============================================================================
# Local connections (Unix domain socket) - ALLOWED
# These are connections from the same machine via socket
local   all             all                                     md5

# IPv4 local loopback connections - ALLOWED
# Backend container connections via Docker network (172.17.0.x)
host    all             all             127.0.0.1/32            md5
host    all             all             172.17.0.0/16           md5

# IPv6 local loopback connections - ALLOWED
host    all             all             ::1/128                 md5

# ============================================================================
# DENY: All other connections (external/internet)
# This prevents unauthorized access from the internet
host    all             all             0.0.0.0/0               reject
host    all             all             ::/0                    reject
